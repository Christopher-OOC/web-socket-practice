<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>WebSocket Project</title>
  </head>
  <body>
    <div id="wrapper">
      <h1>WebSocket Echo Demo</h1>
      <button id="open_ws=" type="submit">Open WS</button>
      <div id="status">Status: Not connected</div>
      <ul id="table"></ul>
      <form id="form">
        <textarea
          id="message"
          placeholder="Write yur message here"
          required
        ></textarea>
        <button type="submit">Send Message</button>
        <button id="close">Close Connection</button>
    </form>
    </div>
  </body>
</html>
